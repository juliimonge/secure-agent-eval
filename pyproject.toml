[project]
name = "secure-agent-eval"
version = "0.1.0"
description = "An offline evaluation harness for LLM agent behaviour under adversarial conditions, bilingual EN/ES."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["secure_agent_eval*"]
